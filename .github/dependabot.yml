version: 2
updates:
  - package-ecosystem: docker
    directory: "/.devcontainer"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    labels:
      - "Type: Maintenance"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    labels:
      - "Type: Maintenance"
    groups:
      tailwind:
        patterns:
          - "actions/*"
